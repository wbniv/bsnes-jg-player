<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Browser WASM layout proof · synthetic shell</title>
<style>
  :root{color-scheme:dark;--bg:#0a0b27;--fg:#eef0ff;--dim:#a8add0;--accent:#7dd3fc;--line:#262a36}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
  header{padding:18px 20px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 2px;font-size:18px;letter-spacing:.2px}
  h1 .mono{font-family:ui-monospace,monospace;color:var(--accent)}
  .sub{color:var(--dim);font-size:13px}
  main{max-width:760px;margin:0 auto;padding:18px 20px 40px}
  #game{width:100%;aspect-ratio:4/3;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex}
  #screen{width:100%;height:100%;object-fit:fill;aspect-ratio:4/3;image-rendering:pixelated}
  nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px;align-items:center}
  button,.file{background:#1b1f2a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:inherit}
  .statusline{display:flex;justify-content:space-between;gap:12px;color:var(--dim);font-size:12px}
  .keys{margin-top:10px;font-size:11.5px;color:var(--dim)}
  .banner{margin-top:14px;padding:10px 12px;border:1px solid #343852;border-radius:6px;color:#c6cae0;font-size:12px}
  @media(max-width:600px){header{padding:12px 14px 8px}h1{font-size:16px}.sub{font-size:12px}main{width:100%;padding:12px 14px 24px}nav{gap:6px;margin-top:12px}button,.file{padding:6px 9px;font-size:12px}}
  @media(orientation:landscape) and (max-height:620px){header{padding:6px 12px}h1{font-size:15px}.sub{display:none}main{max-width:none;width:100%;padding:8px 12px 16px}#game{width:min(100%,calc((100dvh - 150px)*4/3));margin:0 auto}nav{gap:5px;margin:8px 0 4px}button,.file{padding:5px 8px;font-size:11px}.keys{margin-top:5px}.banner{margin-top:8px}}
</style>
</head>
<body>
<header><h1><span class="mono">bsnes-jg-wasm</span> — browser game shell</h1><div class="sub">Synthetic layout pattern · no ROM loaded</div></header>
<main>
  <div id="game" aria-label="synthetic 4:3 game display"><canvas id="screen" width="256" height="224"></canvas></div>
  <nav aria-label="sample browser controls"><button>Display</button><button>Zoom</button><button>Mode-7</button><button>Interactive</button><button>Load .sfc…</button><button>Verify</button></nav>
  <div class="statusline"><span>Layout proof · synthetic pattern</span><span>4:3 display</span></div>
  <div class="keys">Browser shell controls · keyboard and touch remain available</div>
  <div class="banner"><b>Proof content</b> — colored geometry markers validate the game shell and aspect ratio. No ROM or game content is present.</div>
</main>
<script>
  var c=document.getElementById('screen'),x=c.getContext('2d'),colors=['#164e63','#7c2d12','#365314','#4c1d95','#854d0e','#155e75','#7f1d1d'];
  for(var y=0;y<7;y++)for(var i=0;i<8;i++){x.fillStyle=colors[(y+i)%colors.length];x.fillRect(i*32+2,y*32+2,28,28)}
  x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(1,1,254,222);x.fillStyle='#fff';x.font='bold 9px sans-serif';x.textAlign='center';x.fillText('TOP EDGE',128,18);x.fillText('BOTTOM EDGE',128,216);
</script>
</body></html>
