<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" fill="white"/><text x="30" y="30" font-family="sans-serif" font-size="20">Pixel exploratory presentation rate (different refresh modes)</text><line x1="90" y1="245" x2="840" y2="245" stroke="#333"/><line x1="90" y1="55" x2="90" y2="245" stroke="#333"/><text x="14" y="61" font-family="sans-serif" font-size="12">120 fps</text><text x="38" y="248" font-family="sans-serif" font-size="12">0</text><line x1="90" y1="55" x2="840" y2="55" stroke="#bbb" stroke-dasharray="4"/><text x="780" y="50" font-family="sans-serif" font-size="12">120Hz ceiling</text><rect x="170" y="229.2" width="90" height="15.8" fill="#e19b37"/><text x="215" y="220" text-anchor="middle" font-family="sans-serif" font-size="13">9.96</text><text x="215" y="268" text-anchor="middle" font-family="sans-serif" font-size="13">WASM run 1</text><rect x="300" y="236.5" width="90" height="8.5" fill="#e19b37"/><text x="345" y="227" text-anchor="middle" font-family="sans-serif" font-size="13">5.39</text><text x="345" y="268" text-anchor="middle" font-family="sans-serif" font-size="13">WASM run 2</text><rect x="430" y="235.6" width="90" height="9.4" fill="#e19b37"/><text x="475" y="226" text-anchor="middle" font-family="sans-serif" font-size="13">5.93</text><text x="475" y="268" text-anchor="middle" font-family="sans-serif" font-size="13">WASM run 3</text><rect x="620" y="56.3" width="90" height="188.7" fill="#4086bd"/><text x="665" y="48" text-anchor="middle" font-family="sans-serif" font-size="13">119.17</text><text x="665" y="268" text-anchor="middle" font-family="sans-serif" font-size="13">Native run 1</text><text x="450" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">WASM sampled at 60Hz; native sampled at 120Hz. Not a speedup comparison.</text></svg>
