<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Google TV pause and remote menu mockup</title>
  <desc id="desc">The maximum-size 8 by 7 SNES image remains unobscured. A narrow menu occupies the otherwise unused right side gutter and shows D-pad-focused remote actions.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111a27"/><stop offset="1" stop-color="#030508"/></linearGradient>
    <radialGradient id="fractal" cx="49%" cy="50%" r="68%"><stop stop-color="#ffeda2"/><stop offset=".13" stop-color="#ff933f"/><stop offset=".3" stop-color="#dd438c"/><stop offset=".53" stop-color="#6e51d4"/><stop offset=".77" stop-color="#155caa"/><stop offset="1" stop-color="#071a37"/></radialGradient>
    <pattern id="pixels" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#000" stroke-opacity=".13" stroke-width="1"/></pattern>
    <clipPath id="gameClip"><rect x="240" width="1440" height="1080"/></clipPath>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="240" width="1440" height="1080" fill="#02030a"/>
  <g clip-path="url(#gameClip)">
    <rect x="240" width="1440" height="1080" fill="url(#fractal)"/>
    <g transform="translate(960 540) scale(2.5)" fill="none" stroke="#ffe7bb" stroke-opacity=".8" stroke-width="1.1">
      <path d="M-132 18 C-129-28-91-57-44-45 C-7-36 1-4 31-1 C66 3 94-28 119-13 C147 4 124 45 97 54 C62 65 47 36 17 40 C-21 45-30 81-72 78 C-112 75-137 54-132 18Z"/>
      <path d="M-116 20 C-111-15-82-39-51-33 C-20-28-8 1 17 7 C43 12 72-10 95-1 C119 8 108 34 84 42 C57 51 39 30 14 31 C-17 31-33 63-65 63 C-94 63-119 47-116 20Z"/>
      <path d="M-99 18 C-96-5-75-23-53-20 C-29-17-17 5 5 13 C27 21 49 3 70 9 C88 15 83 33 63 36 C42 40 29 24 9 22 C-16 20-34 45-58 47 C-80 48-101 37-99 18Z"/>
      <path d="M-83 15 C-77 2-63-5-48 0 C-31 5-19 21-1 25 C17 30 31 18 46 20 C57 21 58 31 43 31 C25 31 18 23 2 21 C-20 18-36 35-55 34 C-71 34-87 26-83 15Z"/>
      <path d="M-66 12 C-54 8-44 16-34 24 C-23 32-8 35 4 32 C17 29 25 27 31 30 C13 45-10 48-31 39 C-48 32-64 28-66 12Z"/>
      <circle cx="-42" cy="14" r="6" fill="#fff0c7" stroke="none"/>
    </g><image href="../../../android-tv/fixture/reference-5800.png" x="240" y="0" width="1440" height="1080" preserveAspectRatio="none" image-rendering="pixelated"/><rect x="240" width="1440" height="1080" fill="url(#pixels)" opacity=".32"/>
  </g>
  <path d="M240 0V1080M1680 0V1080" stroke="#9ab4d0" stroke-opacity=".12"/>
  <g font-family="Roboto,Arial,sans-serif" fill="#dce7f4">
    <text x="54" y="74" font-size="25" font-weight="700" letter-spacing="1.5">bsnes-jg</text>
    <text x="54" y="108" font-size="20" fill="#92a8c1">MANDEL DISPLAY</text>
    <text x="54" y="1000" font-size="16" font-weight="700" fill="#7790aa" letter-spacing="2">REMOTE</text>
    <rect x="54" y="1024" width="49" height="35" rx="8" fill="#253449" stroke="#506982"/>
    <text x="111" y="1048" font-size="16" fill="#9fb3c9">BACK</text>
  </g>
  <rect x="1680" width="240" height="1080" fill="#0a101aeF"/>
  <g font-family="Roboto,Arial,sans-serif" filter="url(#shadow)">
    <text x="1610" y="268" fill="#8ca2bb" font-size="15" font-weight="700" letter-spacing="2">PLAYBACK</text>
    <text x="1610" y="313" fill="#f5f8fd" font-size="30" font-weight="700">Paused</text>
    <text x="1610" y="344" fill="#91a5bc" font-size="16">Mandel display</text>
    <rect x="1598" y="380" width="307" height="64" rx="12" fill="#274b6b" stroke="#8dcfff" stroke-width="3"/>
    <path d="M1623 400v24l20-12z" fill="#e9f6ff"/>
    <text x="1660" y="420" fill="#f3f8fd" font-size="18" font-weight="700">Resume</text>
    <rect x="1598" y="456" width="307" height="60" rx="10" fill="#172537" stroke="#2e4056"/>
    <text x="1623" y="493" fill="#dce7f4" font-size="17" font-weight="600">↻   Restart demo</text>
    <rect x="1598" y="526" width="307" height="60" rx="10" fill="#172537" stroke="#2e4056"/>
    <text x="1623" y="563" fill="#dce7f4" font-size="17" font-weight="600">✓   Verify from start</text>
    <rect x="1598" y="596" width="307" height="60" rx="10" fill="#172537" stroke="#2e4056"/>
    <text x="1623" y="633" fill="#dce7f4" font-size="17" font-weight="600">⏻   Exit app</text>
    <text x="1610" y="715" fill="#8196ad" font-size="15">Use ↑ ↓, then Select</text>
    <text x="1610" y="744" fill="#8196ad" font-size="15">Back resumes playback</text>
  </g>
</svg>
