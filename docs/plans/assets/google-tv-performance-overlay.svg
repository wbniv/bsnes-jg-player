<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="760" viewBox="0 0 1920 760" role="img" aria-labelledby="title desc">
  <title id="title">Google TV performance overlay mockups</title>
  <desc id="desc">Two 16:9 Google TV mockups. The first shows the WASM build label, a 4:3 SNES display with live Cast1 performance meters and sparklines in the right side gutter. The second shows the Native build label and D-pad pause menu with the overlay toggle.</desc>
  <defs>
    <linearGradient id="tvbg" x2="0" y2="1"><stop stop-color="#111c29"/><stop offset="1" stop-color="#090e15"/></linearGradient>
    <linearGradient id="fractal" x2="1" y2="1"><stop stop-color="#1239df"/><stop offset=".48" stop-color="#267ed0"/><stop offset=".74" stop-color="#7ae66f"/><stop offset="1" stop-color="#dbff20"/></linearGradient>
    <pattern id="pixels" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 0h28v28H0z" fill="none" stroke="#08101a" stroke-opacity=".42"/><path d="M0 0h14v14H0zM14 14h14v14H14z" fill="#fff" opacity=".035"/></pattern>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1920" height="760" rx="22" fill="#080c12"/>
  <text x="46" y="46" fill="#91a7bd" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">GOOGLE TV · FIXED LANDSCAPE COMPOSITION · 16:9</text>
  <text x="46" y="88" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="30" font-weight="700">Performance overlay · remote-controlled · shared metric labels</text>
  <text x="50" y="132" fill="#b6c5d4" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">01 · PLAYING · OVERLAY VISIBLE</text>
  <text x="990" y="132" fill="#b6c5d4" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">02 · PAUSE MENU · TOGGLE ON</text>

  <!-- Playing screen: 900 × 506 fixed 16:9; 4:3 game image sized to leave a readable right gutter -->
  <g transform="translate(50 150)">
    <rect width="900" height="506" rx="10" fill="url(#tvbg)" stroke="#4a5c6f" stroke-width="2"/>
    <text x="28" y="52" fill="#eef4fa" font-family="Arial,sans-serif" font-size="19" font-weight="700">bsnes-jg WASM</text>
    <text x="28" y="82" fill="#a9bacb" font-family="Arial,sans-serif" font-size="14">mandel-display · 256×224</text>
    <rect x="28" y="101" width="83" height="24" rx="12" fill="#173247" stroke="#527690"/>
    <text x="69" y="118" text-anchor="middle" fill="#bde6ff" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">PERF ON</text>
    <text x="28" y="480" fill="#8fa2b5" font-family="Arial,sans-serif" font-size="13">BACK · Pause / menu</text>
    <rect x="161" y="36.25" width="578" height="433.5" fill="url(#fractal)"/>
    <rect x="161" y="36.25" width="578" height="433.5" fill="url(#pixels)"/>
    <path d="M340 36.25h399v78.2H407q-72 0-72 71t72 71h87q84 0 84 78t-84 78H161v-72h269q53 0 53-45t-53-45h-79q-88 0-88-104t77-106z" fill="#05080d"/>
    <rect x="160" y="36.25" width="580" height="433.5" fill="none" stroke="#627384"/>
    <g>
      <text x="768" y="96" fill="#9eb4c9" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">PERFORMANCE</text>
      <text x="768" y="128" fill="#f3f7fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">EMU FPS</text>
      <text x="768" y="166" fill="#91e7a4" font-family="Arial,sans-serif" font-size="31" font-weight="700">2.1</text>
      <text x="768" y="184" fill="#91a5b9" font-family="Arial,sans-serif" font-size="10">target 60.0988</text>
      <polyline points="768,193 782,192 796,193 810,191 824,192 838,190 852,191 868,190" fill="none" stroke="#91e7a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M768 201h100" stroke="#35495d"/>
      <text x="768" y="221" fill="#f3f7fb" font-family="Arial,sans-serif" font-size="13" font-weight="700">DRAW FPS</text>
      <text x="768" y="258" fill="#8ed8ff" font-family="Arial,sans-serif" font-size="31" font-weight="700">0.5</text>
      <polyline points="768,269 782,268 796,269 810,268 824,267 838,268 852,266 868,267" fill="none" stroke="#8ed8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M768 278h100" stroke="#35495d"/>
      <text x="768" y="300" fill="#c4d1dd" font-family="Arial,sans-serif" font-size="10">CORE mean 515.6 ms</text>
      <text x="768" y="315" fill="#aab9c8" font-family="Arial,sans-serif" font-size="9">p95 545.7 ms</text>
      <text x="768" y="337" fill="#c4d1dd" font-family="Arial,sans-serif" font-size="10">DRAW mean 2.0 ms</text>
      <text x="768" y="352" fill="#aab9c8" font-family="Arial,sans-serif" font-size="9">p95 2.2 ms</text>
      <text x="768" y="377" fill="#91a5b9" font-family="Arial,sans-serif" font-size="10">BACKLOG 35,156</text>
      <text x="768" y="392" fill="#91a5b9" font-family="Arial,sans-serif" font-size="9">SNES frames</text>
      <text x="768" y="414" fill="#8195a9" font-family="Arial,sans-serif" font-size="8">App-side rates,</text>
      <text x="768" y="426" fill="#8195a9" font-family="Arial,sans-serif" font-size="8">not panel FPS</text>
    </g>
  </g>

  <!-- Paused screen: same fixed-size 16:9 screen and same unobscured game frame -->
  <g transform="translate(990 150)">
    <rect width="900" height="506" rx="10" fill="url(#tvbg)" stroke="#4a5c6f" stroke-width="2"/>
    <rect x="161" y="36.25" width="578" height="433.5" fill="url(#fractal)"/>
    <rect x="161" y="36.25" width="578" height="433.5" fill="url(#pixels)"/>
    <path d="M340 36.25h399v78.2H407q-72 0-72 71t72 71h87q84 0 84 78t-84 78H161v-72h269q53 0 53-45t-53-45h-79q-88 0-88-104t77-106z" fill="#05080d"/>
    <rect width="900" height="506" rx="10" fill="#05080d" opacity=".56"/>
    <g filter="url(#shadow)">
      <rect x="286" y="38" width="500" height="430" rx="18" fill="#13202d" stroke="#52677b" stroke-width="2"/>
      <text x="324" y="91" fill="#f2f6fa" font-family="Arial,sans-serif" font-size="26" font-weight="700">Paused · bsnes-jg Native</text>
      <text x="324" y="119" fill="#a7bacd" font-family="Arial,sans-serif" font-size="15">NATIVE C++ · mandel-display</text>
      <path d="M324 137h424" stroke="#35495d"/>
      <rect x="314" y="155" width="444" height="55" rx="10" fill="#d8efff"/>
      <text x="344" y="190" fill="#101a24" font-family="Arial,sans-serif" font-size="19" font-weight="700">Resume</text>
      <text x="344" y="247" fill="#dbe5ef" font-family="Arial,sans-serif" font-size="18">Restart</text>
      <text x="344" y="294" fill="#dbe5ef" font-family="Arial,sans-serif" font-size="18">Verify from start</text>
      <rect x="314" y="313" width="444" height="52" rx="10" fill="#23394a" stroke="#87cefa" stroke-width="2"/>
      <text x="344" y="346" fill="#f1f7fc" font-family="Arial,sans-serif" font-size="17" font-weight="700">Performance overlay</text>
      <rect x="704" y="326" width="38" height="24" rx="12" fill="#76d99a"/>
      <circle cx="729" cy="338" r="9" fill="#102017"/>
      <text x="344" y="401" fill="#dbe5ef" font-family="Arial,sans-serif" font-size="18">Exit to Google TV</text>
      <text x="324" y="441" fill="#8195a9" font-family="Arial,sans-serif" font-size="12">D-pad to toggle · Select confirms · Back resumes</text>
    </g>
  </g>
  <text x="50" y="704" fill="#879bad" font-family="Arial,sans-serif" font-size="15">Cast1 WASM sample: 2.1 EMU FPS · 0.5 DRAW FPS · 515.6ms core mean · 35,156-frame backlog · Values are from the ten-minute run.</text>
</svg>
