version: '3'

# bsnes-jg-wasm — build the gate's cycle-accurate SNES core to WebAssembly and
# serve a page that runs the +mos-a16 homebrew demos.

includes:
  chromecast:
    taskfile: Taskfile.chromecast.yml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: "Bootstrap emsdk + build the bsnes-jg WASM core into web/cores/"
    cmds:
      - ./build.sh

  bundle:
    desc: "Emit a single-program (mandel-display) bundle into dist-bundle/ for hosting/embedding"
    cmds:
      - ./deploy-bundle.sh

  serve:
    desc: "Serve web/ at http://localhost:8000 (single-threaded; no special headers)"
    cmds:
      - ./serve.py

  serve-isolated:
    desc: "Serve web/ with COOP/COEP headers (needed only for a threaded core build)"
    cmds:
      - ./serve.py --isolated

  android-tv:build:
    desc: "Test the TV frame clock and build/verify Debug and profile Release APKs in the rootless container"
    cmds:
      - ./android-tv/build-in-container.sh

  sync-roms:
    desc: "Refresh web/roms/*.sfc from a sibling llvm-mos-65816 checkout"
    cmds:
      - ./sync-roms.sh

  package:
    desc: "Stage web/ artifacts into dist/ (the committed npm payload) — run after build"
    cmds:
      - bash scripts/stage-dist.sh

  publish-dry:
    desc: "npm pack --dry-run: show exactly what a publish would ship"
    cmds:
      - npm pack --dry-run

  sync-smoke:
    desc: "Smoke-test the sync CLI (sync --demo, --check, tamper detection)"
    cmds:
      - npm test

  clean:
    desc: "Remove built core artifacts (keeps emsdk + vendored core clone)"
    cmds:
      - rm -f web/cores/*.wasm web/cores/*.js web/cores/*.data web/cores/*.bc web/cores/PROVENANCE.json
